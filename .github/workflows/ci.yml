name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            6.0.x
            7.0.x
            8.0.x
            9.0.x
            10.0.x

      - name: Build
        run: dotnet build src/FluentEventBus.sln -c Release

      - name: Test
        run: dotnet test src/FluentEventBus.sln -c Release --no-build --logger "console;verbosity=normal"
