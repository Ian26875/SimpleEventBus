name: Release to NuGet

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            6.0.x
            7.0.x
            8.0.x
            9.0.x
            10.0.x

      - name: Derive version from tag
        run: echo "PACKAGE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Build
        run: dotnet build src/SimpleEventBus.sln -c Release /p:Version=${PACKAGE_VERSION}

      - name: Test
        run: dotnet test src/SimpleEventBus.sln -c Release --no-build

      - name: Pack
        run: dotnet pack src/SimpleEventBus.sln -c Release --no-build -o artifacts /p:Version=${PACKAGE_VERSION}

      - name: Push to NuGet
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --api-key "${{ secrets.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
